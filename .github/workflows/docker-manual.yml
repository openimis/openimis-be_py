name: create manual docker image 
on:
  workflow_dispatch:
    inputs:   
      tag:
        description: 'Docker tag(s), comma or space separated, e.g. "26.10.1, 26.10"'
        required: true
      file_url:
        description: 'url (CURL compatible) of your custom openIMIS.json'
        required: false

jobs:
  publish-manual-docker-image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Download custom openimis.json
      if: ${{ inputs.file_url != '' }}
      run: |
          curl -o ./openimis.json ${{ inputs.file_url }}
    - name: Build the openimis backend  Docker image
      env:
        TAGS: ${{ github.event.inputs.tag }}
      run: |
         # one build, pushed under every tag of the comma or space separated list
         read -ra tags <<< "${TAGS//,/ }"
         if [ ${#tags[@]} -eq 0 ]; then echo "::error::no tag given"; exit 1; fi
         for t in "${tags[@]}"; do
           if ! [[ "$t" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then echo "::error::invalid docker tag: $t"; exit 1; fi
         done
         docker build . --tag ghcr.io/openimis/openimis-be:${tags[0]}
         for t in "${tags[@]:1}"; do docker tag ghcr.io/openimis/openimis-be:${tags[0]} ghcr.io/openimis/openimis-be:$t; done
         for t in "${tags[@]}"; do docker push ghcr.io/openimis/openimis-be:$t; done
